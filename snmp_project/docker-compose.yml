services:
  redis:
    image: redis:alpine
    container_name: snmp_redis
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: snmp_django_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  celery_worker:
    build: .
    container_name: snmp_celery_worker
    command: celery -A snmp_project worker -l info
    volumes:
      - .:/app
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - web

  celery_beat:
    build: .
    container_name: snmp_celery_beat
    command: celery -A snmp_project beat -l info
    volumes:
      - .:/app
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - web